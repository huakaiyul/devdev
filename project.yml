name: GrabDesk
options:
  bundleIdPrefix: com.banxia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # 注意：SWIFT_VERSION 是语言版本（5.0），不是编译器版本，写 5.9 会被 Xcode 判为非法值。
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GrabDesk:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banxia.grabdesk
        PRODUCT_NAME: GrabDesk
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GrabDesk-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies: []

schemes:
  GrabDesk:
    build:
      targets:
        GrabDesk: all
    run:
      config: Debug
    archive:
      config: Release
